# The gate. Three jobs, run in parallel, all required.
#
# The reason this file matters more than most CI configs: eight integration test
# classes -- 127 executions -- cannot run on the machine they were written on,
# because Testcontainers needs a Docker daemon and that machine has none. GitHub's
# ubuntu runners have one. This workflow is the only place the concurrency
# suite -- bed allocation, payment idempotency, reminder and absence-scan
# idempotence -- actually executes, and its first run found three production
# defects that a fully green unit suite had not. See docs/concurrency.md section 6.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch makes the first run's result irrelevant.
# Cancel it rather than paying for an answer nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — unit + integration
    runs-on: ubuntu-latest
    # Testcontainers pulls postgres:17-alpine and the ITs hold row locks on
    # purpose; the default 360 minutes is not a timeout, it is a blank cheque.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # `verify`, not `test`. Surefire runs *Test; failsafe runs *IT and is bound
      # to verify (see the comment in backend/pom.xml). `test` alone would pass
      # while every concurrency guarantee in the codebase went unchecked.
      - name: Build, unit test and integration test
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress verify

      # Reports are only interesting when something broke, and that is exactly
      # when the log has scrolled past the useful part.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: backend/target/site/jacoco/
          retention-days: 7

  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `ci`, not `install`: the lockfile is the input, and a job that may
      # silently resolve a different tree is not testing what will ship.
      - name: Install
        working-directory: frontend
        run: npm ci

      # Run on its own as well as via the build, so a type error is reported as a
      # type error rather than buried in a build log.
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          # Only to make the build deterministic. The real value is baked per
          # deployment; nothing in a NEXT_PUBLIC_* variable is ever secret.
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080

  images:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds only -- nothing is pushed and no registry credential exists in
      # this workflow. The point is that a Dockerfile which stopped building is
      # caught here rather than by the next person to clone the repository.
      - name: Build both images
        run: docker compose build
        env:
          # docker compose interpolates the whole file before it builds anything,
          # and JWT_SECRET is declared with `:?` so a real deployment cannot come
          # up without one. This value is never used: no container is started.
          JWT_SECRET: ci-interpolation-placeholder-no-container-is-started
